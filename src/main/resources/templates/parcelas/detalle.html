
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle de parcela</title>
</head>
<body>

<h1 th:text="${parcela.nombre}">Nombre de la parcela</h1>

<dl>
    <dt>Identificador:</dt>
    <dd th:text="${parcela.id}"></dd>

    <dt>Ubicación:</dt>
    <dd th:text="${parcela.ubicacion}"></dd>

    <dt>Superficie:</dt>
    <dd th:text="${parcela.superficie + ' ha'}"></dd>

    <dt>Cultivo:</dt>
    <dd th:text="${parcela.tipoCultivo?.etiqueta}"></dd>
</dl>

<a th:href="@{/parcelas}">Volver al listado</a>

</body>
</html>
