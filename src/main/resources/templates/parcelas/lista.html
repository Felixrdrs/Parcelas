<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/base :: pagina(~{::title}, 'parcelas', ~{::section})}">
<head>
    <title>Parcelas · AgroTech</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Listado de Parcelas</h1>
        <a th:href="@{/parcelas/nuevo}" class="btn btn-sm btn-success">
            <i class="bi bi-plus-lg me-1"></i> Nueva Parcela
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th>Superficie (ha)</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${parcelas}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nombre}">Sector Norte</td>
                <td th:text="${p.ubicacion}">Finca Principal</td>
                <td th:text="${p.superficie}">12.5</td>
                <td>
                    <a th:href="@{/parcelas/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-eye"></i></a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
