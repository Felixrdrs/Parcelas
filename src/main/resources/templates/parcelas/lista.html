<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">


<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Parcelas</title>
</head>
<body>

<h1>Lista de parcelas</h1>

<a th:href="@{/parcelas/nueva}">+ Nueva parcela</a>

<table border="1">
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Ubicación</th>
        <th>Superficie (ha)</th>
        <th>Cultivo</th>
        <th>Acciones</th>
    </tr>
    </thead>

    <tbody>

    <tr th:if="${parcelas.isEmpty()}">
        <td colspan="5">No hay parcelas disponibles</td>
    </tr>

    <tr th:each="p : ${parcelas}">
        <td>
            <a th:href="@{/parcelas/{id}(id=${p.id})}"
               th:text="${p.nombre}"></a>
        </td>

        <td th:text="${p.ubicacion}"></td>

        <td th:text="${p.superficie}"></td>

        <td th:text="${p.tipoCultivo?.etiqueta}"></td>

        <td>
            <form th:action="@{/parcelas/{id}/eliminar(id=${p.id})}"
                  method="post"
                  onsubmit="return confirm('¿Seguro que quieres eliminar esta parcela?');">

                <button type="submit">Eliminar</button>

            </form>
        </td>
    </tr>

    </tbody>
</table>

</body>
</html>
