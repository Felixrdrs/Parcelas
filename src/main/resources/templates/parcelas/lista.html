<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/base :: pagina(~{::title}, 'parcelas', ~{::section})}">
<head>
    <title>Parcelas · AgroTech</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2 mb-0">Listado de Parcelas</h1>

        <a th:href="@{/parcelas/nueva}"
           class="btn btn-sm btn-success">
            <i class="bi bi-plus-lg me-1"></i>Nueva parcela
        </a>
    </div>

    <form th:action="@{/parcelas}" method="get"
          class="card border-0 shadow-sm rounded-3 mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="q"
                           class="form-label small fw-semibold text-muted">
                        Buscar por nombre o ubicación
                    </label>

                    <input type="text" id="q" name="q"
                           th:value="${q}" class="form-control"
                           placeholder="Ej. Sector Norte o Finca El Roble">
                </div>

                <div class="col-md-4">
                    <label for="cultivo"
                           class="form-label small fw-semibold text-muted">
                        Tipo de cultivo
                    </label>

                    <select id="cultivo" name="cultivo"
                            class="form-select">
                        <option value="">Todos</option>

                        <option th:each="t : ${tipos}"
                                th:value="${t}"
                                th:text="${t.etiqueta}"
                                th:selected="${t == cultivoSel}">
                            Olivar
                        </option>
                    </select>
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary flex-grow-1">
                        <i class="bi bi-search me-1"></i>Filtrar
                    </button>

                    <a th:href="@{/parcelas}"
                       class="btn btn-outline-secondary">
                        Limpiar
                    </a>
                </div>
            </div>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(parcelas)}"
         class="alert alert-info d-flex align-items-center gap-2"
         role="alert">
        <i class="bi bi-info-circle-fill"></i>
        <span>
            No se han encontrado parcelas con los criterios indicados.
        </span>
    </div>

    <div th:if="${!#lists.isEmpty(parcelas)}"
         class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th>Superficie</th>
                <th>Cultivo</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p, stat : ${parcelas}">
                <td th:text="${stat.count}">1</td>

                <td>
                    <a th:href="@{/parcelas/{id}(id=${p.id})}"
                       th:text="${p.nombre}"
                       class="fw-semibold text-decoration-none">
                        Sector Norte
                    </a>
                </td>

                <td th:text="${p.ubicacion}">
                    Finca Principal
                </td>

                <td th:text="${p.superficie != null}
                    ? ${#numbers.formatDecimal(p.superficie, 1, 'POINT', 2, 'COMMA')} + ' ha'
                    : '0,00 ha'">
                    12,50 ha
                </td>

                <td>
                    <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill"
                          th:text="${p.tipoCultivo?.etiqueta}">
                        Cultivo
                    </span>
                </td>

                <td class="text-end">
                    <div class="d-inline-flex gap-1">
                        <a th:href="@{/parcelas/{id}(id=${p.id})}"
                           class="btn btn-sm btn-outline-secondary"
                           title="Ver detalle">
                            <i class="bi bi-eye"></i>
                        </a>

                        <a th:href="@{/parcelas/{id}/editar(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary"
                           title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <form th:action="@{/parcelas/{id}/eliminar(id=${p.id})}"
                              method="post" class="d-inline">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-danger"
                                    title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>

            <tfoot class="table-light fw-semibold"
                   th:with="total=${#aggregates.sum(parcelas[superficie])}">
            <tr>
                <td colspan="3">
                    Total mostradas:
                    <span th:text="${#lists.size(parcelas)}">0</span>
                </td>
                <td th:text="${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')} + ' ha'">
                    0,00 ha
                </td>
                <td colspan="2"></td>
            </tr>
            </tfoot>
        </table>
    </div>
</section>
</body>
</html>
