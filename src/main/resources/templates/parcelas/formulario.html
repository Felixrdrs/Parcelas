<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/base :: pagina(~{::title}, 'parcelas', ~{::section})}">
<head>
    <title th:text="${parcela.id == null} ? 'Nueva Parcela · AgroTech' : 'Editar Parcela · AgroTech'">Formulario de Parcela</title>
</head>
<body>
<section>
    <div class="container-fluid px-0" style="max-width: 750px;">

        <!-- Breadcrumb y título -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small text-muted">
                    <li class="breadcrumb-item"><a th:href="@{/parcelas}" class="text-decoration-none text-success">Parcelas</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${parcela.id == null} ? 'Nueva' : 'Editar'">Formulario</li>
                </ol>
            </nav>
            <h1 class="h3 fw-bold text-dark mb-0" th:text="${parcela.id == null} ? 'Nueva Parcela' : 'Editar Parcela'">Formulario de parcela</h1>
        </div>

        <!-- Tarjeta moderna con sombra suave -->
        <div class="card border-0 shadow-sm rounded-4 p-4 p-lg-5 bg-white">
            <div class="card-body p-0">

                <form th:action="@{/parcelas}" th:object="${parcela}" method="post">

                    <!-- Campo oculto por si se usa el mismo formulario para editar -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="row g-4">

                        <!-- Nombre -->
                        <div class="col-md-6">
                            <label for="nombre" class="form-label fw-semibold text-dark">Nombre</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-tag"></i></span>
                                <input type="text" id="nombre" th:field="*{nombre}"
                                       class="form-control border-start-0 ps-0"
                                       th:errorclass="is-invalid"
                                       placeholder="Ej. Sector Norte" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <!-- Ubicación -->
                        <div class="col-md-6">
                            <label for="ubicacion" class="form-label fw-semibold text-dark">Ubicación</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                                <input type="text" id="ubicacion" th:field="*{ubicacion}"
                                       class="form-control border-start-0 ps-0"
                                       th:errorclass="is-invalid"
                                       placeholder="Ej. Finca El Roble" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('ubicacion')}" th:errors="*{ubicacion}"></div>
                        </div>

                        <!-- Superficie (ha) -->
                        <div class="col-md-6">
                            <label for="superficie" class="form-label fw-semibold text-dark">Superficie (ha)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-aspect-ratio"></i></span>
                                <input type="number" id="superficie" th:field="*{superficie}"
                                       step="0.01" min="0.01"
                                       class="form-control border-start-0 ps-0"
                                       th:errorclass="is-invalid"
                                       placeholder="0,00" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('superficie')}" th:errors="*{superficie}"></div>
                        </div>

                        <!-- Cultivo -->
                        <div class="col-md-6">
                            <label for="tipoCultivo" class="form-label fw-semibold text-dark">Cultivo</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-flower2"></i></span>
                                <select id="tipoCultivo" th:field="*{tipoCultivo}"
                                        class="form-select border-start-0 ps-0"
                                        th:errorclass="is-invalid" required>
                                    <option value="">-- Selecciona --</option>
                                    <option th:each="t : ${tipos}"
                                            th:value="${t}"
                                            th:text="${t.etiqueta}">
                                    </option>
                                </select>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('tipoCultivo')}" th:errors="*{tipoCultivo}"></div>
                        </div>

                    </div>

                    <!-- Botones de acción -->
                    <div class="d-flex justify-content-between align-items-center mt-5 pt-3 border-top">
                        <a th:href="@{/parcelas}" class="btn btn-outline-secondary px-4 rounded-3">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success px-4 rounded-3 shadow-sm d-inline-flex align-items-center gap-2">
                            <i class="bi bi-check-lg"></i> Guardar
                        </button>
                    </div>

                </form>

            </div>
        </div>

    </div>
</section>
</body>
</html>
