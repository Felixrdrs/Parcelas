<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Formulario de Parcela</title>
</head>
<body>

<div class="container mt-4">
    <div class="d-flex flex-wrap align-items-center justify-content-center lg:justify-content-start">
        <ul class="nav col-12 lg:col-auto lg:me-auto mb-2 justify-content-center md:mb-0">
            <li><a th:href="@{/parcelas}" class="nav-link px-2 theme-secondary">Parcelas</a></li>
        </ul>
        <form class="col-12 lg:col-auto mb-3 lg:mb-0 lg:me-3" role="search">
            <input type="search" class="form-control" placeholder="Search..." aria-label="Search">
        </form>
        <div class="text-end">
            <div class="menu">
                <a class="menu-item" href="#">New project...</a>
                <a class="menu-item" href="#">Settings</a>
                <a class="menu-item" href="#">Profile</a>
                <hr class="menu-divider">
                <a class="menu-item" href="#">Sign out</a>
            </div>
        </div>
        <button type="button" class="btn btn-outline theme-secondary">Search</button>
    </div>
</div>

<div class="container mt-4" style="max-width: 600px;">
    <h3>Formulario de parcela</h3>

    <form th:action="@{/parcelas}" th:object="${parcela}" method="post">

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="ubicacion" class="form-label">Ubicación:</label>
            <input type="text" id="ubicacion" th:field="*{ubicacion}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="superficie" class="form-label">Superficie (ha):</label>
            <input type="number" id="superficie" th:field="*{superficie}" step="0.01" min="0.01" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="tipoCultivo" class="form-label">Cultivo:</label>
            <select id="tipoCultivo" th:field="*{tipoCultivo}" class="form-select" required>
                <option value="">-- Selecciona --</option>
                <option th:each="t : ${tipos}"
                        th:value="${t}"
                        th:text="${t.etiqueta}">

                </option>
            </select>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <a th:href="@{/parcelas}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-solid theme-primary">Guardar</button>
        </div>

    </form>
</div>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
