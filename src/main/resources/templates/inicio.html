<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/base :: pagina(~{::title}, 'dashboard', ~{::section})}">
<head>
    <title>Panel · AgroTech</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">Dashboard JJ</h2>

        <span class="badge bg-white text-muted border px-3 py-2 rounded-pill shadow-sm small">
            <i class="bi bi-clock text-success me-1"></i>
            <span th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy HH:mm')}">
                26/11/2026 17:52
            </span>
        </span>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">
                            Superficie total de parcelas (ha)
                        </div>
                        <div class="fs-4 fw-bold text-danger"
                             th:text="${superficieTotal}">0.0</div>
                    </div>
                    <i class="bi bi-vector-pen fs-2 text-danger"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <div class="text-muted small">Total de parcelas</div>
                        <div class="fs-4 fw-bold text-success"
                             th:text="${totalParcelas}">0</div>
                    </div>
                    <i class="bi bi-map fs-2 text-success"></i>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
