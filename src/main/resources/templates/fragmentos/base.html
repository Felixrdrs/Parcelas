<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="pagina(titulo, seccion, contenido)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">AgroTech</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/agrotech.css}">
</head>
<body>
<header th:replace="~{fragmentos/comunes :: barraSuperior}"></header>
<div class="container-fluid">
    <div class="row">
        <nav th:replace="~{fragmentos/comunes :: menuLateral(${seccion})}"></nav>
        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">
            <div th:replace="~{fragmentos/comunes :: mensajes}"></div>
            <section th:replace="${contenido}">Contenido por defecto</section>
            <footer th:replace="~{fragmentos/comunes :: pie}"></footer>
        </main>
    </div>
</div>
<div th:replace="~{fragmentos/comunes :: modalEliminar}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/agrotech.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/agrotech.js}"></script>
</body>
</html>
