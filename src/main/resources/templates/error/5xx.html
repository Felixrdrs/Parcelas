<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor | AgroTech</title>
</head>
<body>

<!--/* Cabecera comun de la aplicacion */-->
<header th:replace="~{fragments/layout :: barraSuperior}"></header>

<div class="container-fluid">
    <div class="row">
        <!--/* Menu lateral comun */-->
        <nav th:replace="~{fragments/layout :: menuLateral('dashboard')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 d-flex flex-column min-vh-100">
            <!--/* Mensajes flash si existen */-->
            <div th:replace="~{fragments/layout :: mensajes}"></div>

            <!--/* Sin trazas, excepciones ni detalles internos del servidor */-->
            <div class="my-4">
                <span class="badge bg-danger mb-2">Error del servidor</span>
                <h1 class="h3 mb-3">Ha ocurrido un problema inesperado</h1>
                <p class="text-muted">
                    No se ha podido completar tu solicitud en este momento. Inténtalo de nuevo más tarde.
                </p>

                <a th:href="@{/}" class="btn btn-success mt-2">
                    <i class="bi bi-speedometer2 me-1"></i>Volver al panel
                </a>
            </div>

            <!--/* Pie de pagina comun */-->
            <footer th:replace="~{fragments/layout :: pie}"></footer>
        </main>
    </div>
</div>

</body>
</html>
