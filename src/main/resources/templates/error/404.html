<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | AgroTech</title>
</head>
<body>

<!--/* Cabecera comun de la aplicacion */-->
<header th:replace="~{fragments/layout :: barraSuperior}"></header>

<div class="container-fluid">
    <div class="row">
        <!--/* Menu lateral con seccion 'dashboard' para no marcar ninguna seccion concreta como activa */-->
        <nav th:replace="~{fragments/layout :: menuLateral('dashboard')}"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 d-flex flex-column min-vh-100">
            <!--/* Mensajes flash si existen en el modelo */-->
            <div th:replace="~{fragments/layout :: mensajes}"></div>

            <!--/* Spring Boot inyecta automaticamente 'path' en el modelo de error; no se muestran trazas */-->
            <div class="my-4">
                <span class="badge bg-secondary mb-2">Error 404</span>
                <h1 class="h3 mb-3">No hemos encontrado esa página</h1>
                <p class="text-muted">
                    La dirección solicitada no existe o ya no está disponible:
                </p>
                <p class="fw-semibold text-break" th:text="${path}">/ruta-solicitada</p>

                <a th:href="@{/}" class="btn btn-success mt-2">
                    <i class="bi bi-speedometer2 me-1"></i>Volver al panel
                </a>
            </div>

            <!--/* Pie de pagina comun */-->
            <footer th:replace="~{fragments/layout :: pie}"></footer>
        </main>
    </div>
</div>

</body>
</html>
