<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/base :: pagina(~{::title}, 'sensores', ~{::section})}">
<head>
    <title>Sensores · AgroTech</title>
</head>
<body>
<section>
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2 mb-0">Listado de Sensores</h1>

        <a th:href="@{/sensors/nuevo}"
           class="btn btn-sm btn-success">
            <i class="bi bi-plus-lg me-1"></i>Nuevo sensor
        </a>
    </div>

    <form th:action="@{/sensors}" method="get"
          class="card border-0 shadow-sm rounded-3 mb-4">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="q"
                           class="form-label small fw-semibold text-muted">
                        Buscar por nombre o modelo
                    </label>

                    <input type="text" id="q" name="q"
                           th:value="${q}" class="form-control"
                           placeholder="Ej. Sonda Humedad o DHT22">
                </div>

                <div class="col-md-4">
                    <label for="tipo"
                           class="form-label small fw-semibold text-muted">
                        Tipo de sensor
                    </label>

                    <select id="tipo" name="tipo"
                            class="form-select">
                        <option value="">Todos</option>

                        <option th:each="t : ${tipos}"
                                th:value="${t}"
                                th:text="${t.etiqueta}"
                                th:selected="${t == tipoSel}">
                            Temperatura
                        </option>
                    </select>
                </div>

                <div class="col-md-3 d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary flex-grow-1">
                        <i class="bi bi-search me-1"></i>Filtrar
                    </button>

                    <a th:href="@{/sensors}"
                       class="btn btn-outline-secondary">
                        Limpiar
                    </a>
                </div>
            </div>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(sensors)}"
         class="alert alert-info d-flex align-items-center gap-2"
         role="alert">
        <i class="bi bi-info-circle-fill"></i>
        <span>
            No se han encontrado sensores con los criterios indicados.
        </span>
    </div>

    <div th:if="${!#lists.isEmpty(sensors)}"
         class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Modelo</th>
                <th>Tipo</th>
                <th>Unidad</th>
                <th>Estado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s, stat : ${sensors}">
                <td th:text="${stat.count}">1</td>

                <td>
                    <a th:href="@{/sensors/{id}(id=${s.id})}"
                       th:text="${s.name}"
                       class="fw-semibold text-decoration-none">
                        Sensor 1
                    </a>
                </td>

                <td th:text="${s.model}">Modelo</td>

                <td>
                    <span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill"
                          th:text="${s.tipo?.etiqueta}">
                        Tipo
                    </span>
                </td>

                <td th:text="${s.unidadMedida != null && !#strings.isEmpty(s.unidadMedida)} ? ${s.unidadMedida} : '-'">
                    -
                </td>

                <td>
                    <span th:if="${s.estado == 'ACTIVO'}"
                          class="badge bg-success-subtle text-success rounded-pill px-3 py-1">
                        Activo
                    </span>
                    <span th:if="${s.estado == 'INACTIVO'}"
                          class="badge bg-secondary-subtle text-secondary rounded-pill px-3 py-1">
                        Inactivo
                    </span>
                    <span th:if="${s.estado != 'ACTIVO' and s.estado != 'INACTIVO'}"
                          th:text="${s.estado != null && !#strings.isEmpty(s.estado)} ? ${s.estado} : '-'">
                        -
                    </span>
                </td>

                <td class="text-end">
                    <div class="d-inline-flex gap-1">
                        <a th:href="@{/sensors/{id}(id=${s.id})}"
                           class="btn btn-sm btn-outline-secondary"
                           title="Ver detalle">
                            <i class="bi bi-eye"></i>
                        </a>

                        <a th:href="@{/sensors/{id}/editar(id=${s.id})}"
                           class="btn btn-sm btn-outline-primary"
                           title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <th:block th:with="urlEliminar=@{/sensors/{id}/eliminar(id=${s.id})}">
                            <div th:replace="~{fragmentos/comunes :: botonEliminar(${urlEliminar}, ${s.name})}"></div>
                        </th:block>
                    </div>
                </td>
            </tr>
            </tbody>

            <tfoot class="table-light fw-semibold">
            <tr>
                <td colspan="7">
                    Total mostrados:
                    <span th:text="${#lists.size(sensors)}">0</span>
                </td>
            </tr>
            </tfoot>
        </table>
    </div>
</section>
</body>
</html>
